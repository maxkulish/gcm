      per the documented fallback. Gemini 3.1 Pro returned PASS_WITH_NOTES with
      zero defects and confirmed all 12 acceptance criteria covered.
    validation_findings_dispositions:
      - finding: 'LOW (src/cli.rs): Cli::max_rounds() accessor from decomposition step 2 was omitted'
        disposition: not_applied
        reason: >-
          Deliberate. remote_push()/no_finish() exist because call sites outside
          cli.rs need them; nothing outside resolve_conflict_config reads
          max_rounds, and that function already gets it from the exhaustive
          Commands::Resolve destructure - which is also what forces future fields
          to be handled at compile time. Adding the accessor would introduce an
          unused pub fn (dead_code) purely for symmetry. Spec decomposition item 2
          is the thing that was slightly wrong here, not the code.
