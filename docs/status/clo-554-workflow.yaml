    review_runs: 2
    review_infra_note: >-
      Run 1: both external reviewers died on a shell quoting bug in
      .lok/workflows/spec-review.toml - the Linear description is interpolated
      inside single-quoted sed expressions, so an apostrophe ("helper's") closed
      the quote and produced "unexpected EOF while looking for matching `''".
      Claude fallback covered it. Run 2 with an apostrophe-free description got a
      real Gemini review; Ollama/Codex still returned banner-only empty output.
      The toml quoting bug is unfixed and will break any future review whose
      description contains an apostrophe or a pipe.
    applied_suggestions:
      - 'BLOCKER: --max-rounds 1 contradiction across AC3/AC6/omission rule/Test 4 resolved - new AC4 pins identical git state + exit code + legacy headline, and states loop metadata is additionally emitted (explicit opt-in, not a compat break); AC7 scopes byte-identical JSON to runs passing no --max-rounds'
      - 'BLOCKER: --max-rounds 0 rejection moved to clap value_parser!(u32).range(1..) - resolve_conflict_config returns ConflictConfig not Result (verified src/resolve/mod.rs:508) so it could not raise an error; config-side 0 specified as a GcmError::Config rejection'
      - 'BLOCKER: added sub-task 7 for the mock-provider harness - mock_ollama_server_multiple has no request counter and a once-computed accept budget (verified tests/resolve_integration.rs:115-151), so AC2 zero-spend was unverifiable; now an Arc<AtomicUsize> counter plus a bounded join'
      - 'Mid-loop abort headline pinned in AC5: today''s "Aborted - working tree restored, nothing changed" (src/resolve/mod.rs:1064) is false once a round is committed and pushes users toward a destructive git rebase --abort'
      - 'AC8 added: envelope on non-completed terminals - top-level finish absent on mid-loop abort (Skip arm returns early, verified src/resolve/mod.rs:348-376), status resolved + stopped_on_conflict on a declined gate'
      - 'AC6 banner corrected to "round i (cap N)" - "round i of N" implied the rebase needs N rounds when N is the ceiling'
      - 'AC10 added: --dry-run and --no-finish each run exactly one round and omit loop (was prose-only in Constraints)'
      - 'AC11 added: no-progress guard promoted from prose to a criterion (exit 0, terminal no_progress, stderr diagnostic) and restructured as a pure predicate so it is unit-testable without provoking a stalled rebase'
      - 'Post-gate head re-read made a Must (Gemini): a user parked at the [y/N] gate can mutate the repo from another terminal, so the sha feeding the banner and the guard must be read after acceptance, not before the prompt'
      - 'Test matrix grew 12 -> 17 rows: config-vs-CLI precedence, config max_rounds=0, cherry-pick sequence promoted from edge case to numbered test, single-round modes, no-progress predicate'
      - 'README.md added to the file list (the [conflict] table at README.md:395-415 has no compiler forcing function); scope corrected 8 -> 9 files, 7 -> 8 sub-tasks'
      - 'Section 1 savings claim trimmed: the loop saves process re-invocation and re-prompting only - config::load, apply_to_env, provider::select and resolve_conflict_config''s own config read all still run per round'
      - 'Ctrl-C exposure documented in Section 1 and the edge cases (no signal handling exists; the loop widens a pre-existing window, recovery is re-running gcm resolve); signing pinentry-per-round documented as a README note'
      - 'Fixture invariant stated for tests 1/3/4: one conflicted file with one Complex hunk per conflicting commit, so one queued mock response maps to exactly one round'
    flagged_suggestions: []
    design_decisions:
      round_gate: 'Owner decision 2026-07-28: a [y/N] gate runs before each round after the first, showing the next stop commit + conflicted file count, so provider spend is authorized before it happens (per-file confirms alone come after the LLM calls). Skipped under --yes.'
      max_rounds_default: 'Owner decision 2026-07-28: default 10; --max-rounds 1 reproduces today''s single-stop behavior; 0 rejected'
      loop_seam: 'Loop driver lives in run_resolve (local entry), not run_resolve_in_repo, so the remote wrapper is untouched'
      signal_not_op: 'Keyed on FinishResult::StoppedOnConflict rather than the op name, so cherry-pick sequences loop too'
      json_additive: 'Additive `loop` object, SCHEMA_VERSION stays 1, omitted whenever the run behaves as today (byte-identical legacy JSON)'
