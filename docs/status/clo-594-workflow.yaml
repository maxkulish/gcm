    assumptions:
      - confidence: high
        text: >-
          In a single-package [lib]+[[bin]] setup, the binary must import shared types from the library crate (use
          gcm::config::Config), not declare mod config; in both targets — otherwise the compiler treats them as distinct
          types.
        verification: Gemini design review flagged this; implementation in CLO-595 will verify via cargo check
      - confidence: high
        text: >-
          cliclack and console must be optional=true in Cargo.toml and gated behind a cli feature — otherwise every
          library consumer inherits them.
        verification: Gemini review flagged this; CLO-595 will verify with cargo tree --no-default-features
      - confidence: high
        text: 'Binary-internal modules do not need #[cfg(not(feature=library))] — omitting them from lib.rs is sufficient.'
        verification: Gemini review flagged this; verified by Rust module system semantics
      - confidence: medium
        text: 'The save function''s 0600 permission logic must use #[cfg(unix)] to avoid breaking Windows builds.'
        verification: Gemini review flagged this; CLO-595 implementation will add the cfg gate
      - confidence: medium
        text: >-
          GcmError contains binary-specific variants; the library may need a lightweight error type or feature-gated
          variants.
        verification: Gemini review flagged this; deferred to CLO-595 — first extraction only exports SecretScanMode
      - confidence: high
        text: >-
          SecretScanMode is the primary export for CLO-595; the scanner's check/filter/redact functions stay in the
          binary for now.
        verification: >-
          CLO-595 scope confirms; .pi/lessons/clo-531-resolve-lessons.md L1 established secret scan must apply to all
          egress paths
      - confidence: high
        text: >-
          Path-only consumption (no crates.io publish) is sufficient because both consumers are in the same
          organization.
        verification: CLO-593 and CLO-595 both use path/git dependencies; revisit when external consumer requests publish
    assumptions_surfaced: true
    applied_suggestions:
      - >-
