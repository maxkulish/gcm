      - confidence: high
        text: >-
          The cli feature in Cargo.toml already includes 'clap' (not just 'dep:clap'), so cfg_attr(feature='clap') fires
          under default features.
        verification: 'Verified by reading Cargo.toml line 18: cli=[''clap'',''dep:cliclack'',...]. Per lesson L2.'
      - confidence: high
        text: >-
          The binary's existing use crate::provider::ProviderId callsites resolve to the facade's pub use
          gcm::provider::ProviderId re-export without changes, maintaining type identity.
        verification: 'Structural: re-exports are transparent in Rust. Per lesson L1, the key is re-exporting, not re-declaring.'
      - confidence: high
        text: >-
          ProviderId::parse can be hand-rolled to match clap::ValueEnum::from_str's alias behavior (gemini to Google,
          google-vertex to Vertex) without behavioral change.
        verification: The aliases are a fixed 2-item mapping; the CLI --provider flag uses clap's derive, not ProviderId::parse.
      - confidence: high
        text: >-
          status.rs's use of crate::provider::ollama (is_cloud_model, normalize_host, DEFAULT_BASE_URL) continues to
          work because the facade declares pub(crate) mod ollama.
        verification: status.rs is binary-only in this ticket; the facade is the binary's provider module.
      - confidence: high
        text: >-
          http.rs's crate::debug_log! calls resolve correctly in the library because src/debug.rs is compiled as pub mod
          debug in lib.rs.
        verification: '#[macro_export] makes the macro available at the library crate root.'
      - confidence: high
        text: >-
          ureq-using functions in http.rs can be gated behind cfg(feature='cli') without breaking the library build,
          since fetch_supported_models_with (the pure surface) does not call them.
        verification: >-
          fetch_supported_models_with takes an injected fetcher; only the convenience wrapper fetch_supported_models
          calls http::get_json.
