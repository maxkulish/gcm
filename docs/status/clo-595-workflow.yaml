    assumptions:
      - text: >-
          `src/privacy/{detect,entropy,rules}.rs` reference only `regex`, `serde`, `toml`, `std`, and each other, so
          they can move into lib without body edits.
        confidence: high
        verification: Verified by import inspection in source files.
      - text: >-
          Integration tests under `tests/` link the `[lib]` target as an external crate would; adding
          `tests/library_api.rs` is sufficient for the first external-consumer validation check.
        confidence: high
        verification: >-
          Will be verified by compiling and adding a new integration test named `library_api` with only `gcm::privacy`
          and `std` types.
      - text: >-
          `required-features = ["cli"]` on the `[[bin]]` target is sufficient to keep `clap`/`cliclack`/`ureq` out of
          the library build without explicit `#[cfg]` in each binary module.
        confidence: medium
        verification: Will be verified with `cargo build --no-default-features` and `cargo tree --no-default-features -e normal`.
      - text: >-
          Moving `ureq`, `sha2`, `which`, and `url` into the `cli` feature is safe because their callsites are
          binary-only.
        confidence: medium
        verification: Will be verified via default-feature builds and existing integration tests after moving modules.
      - text: >-
          `default-run = "gcm"` works with a `required-features` bin and preserves contributor workflows under default
          settings.
        confidence: medium
        verification: Will be confirmed by `cargo run -- --version` and release/install smoke checks.
      - text: >-
          No external crates currently depend on gcm today, so making `SecretScanMode::parse` public and removing direct
          `resolve` process-env access does not break existing consumers.
        confidence: high
        verification: Verified by Linear dependency checks and repository scan in task scope; no downstream importers were found.
      - text: >-
          The acceptance baseline is 475 tests under default features; implementation should maintain or exceed this
          count at merge.
        confidence: high
        verification: Will be recorded by comparing current `cargo test` counts before/after implementation starts.
      - text: >-
          A single `ScanError` enum is sufficient now for scan-mode parse, rule-pack, and abort failures, but
          CLO-596/CLO-597 may require follow-up adjustments.
        confidence: low
        verification: Revisit after CLO-596/CLO-597 define additional error surfaces in adjacent tickets.
